<script>

/* ==========================================
   VARIABEL
   ========================================== */

let redirectLink = "";
let timerStarted = false;
let continueShown = false;


/* ==========================================
   PLAY VIDEO
   ========================================== */

function playVideo(videoUrl, directLink) {

    const player =
        document.getElementById("videoPlayer");

    const wrapper =
        document.getElementById("videoWrapper");

    const status =
        document.getElementById("status");

    const overlay =
        document.getElementById("continueOverlay");


    /* Simpan Direct Link */

    redirectLink = directLink;


    /* Reset */

    timerStarted = false;
    continueShown = false;


    overlay.classList.remove("show");
    player.classList.remove("blurred");


    /* Masukkan video */

    player.src = videoUrl;

    player.load();


    /* Tampilkan player */

    wrapper.style.display = "block";

    status.style.display = "block";

    status.innerHTML =
        "Memuat video...";


    /* Scroll ke video */

    setTimeout(function() {

        wrapper.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }, 100);


    /* Play */

    player.play()
        .then(function() {

            start15SecondTimer();

        })
        .catch(function() {

            status.innerHTML =
                "Tekan tombol ▶ pada video untuk mulai.";

        });

}


/* ==========================================
   TIMER 20 DETIK
   ========================================== */

function start15SecondTimer() {

    if (timerStarted || continueShown) {
        return;
    }

    timerStarted = true;

    const player =
        document.getElementById("videoPlayer");

    const status =
        document.getElementById("status");


    status.innerHTML =
        "Video sedang diputar...";


    /*
     * Timer mengikuti posisi video sebenarnya.
     */

    player.addEventListener(
        "timeupdate",
        checkVideoTime
    );

}


/* ==========================================
   CEK VIDEO SUDAH 20 DETIK
   ========================================== */

function checkVideoTime() {

    const player =
        document.getElementById("videoPlayer");

    const overlay =
        document.getElementById("continueOverlay");

    const status =
        document.getElementById("status");


    if (
        player.currentTime >= 20 &&
        !continueShown
    ) {

        continueShown = true;


        /* Pause video */

        player.pause();


        /* Blur video */

        player.classList.add("blurred");


        /* Tampilkan overlay */

        overlay.classList.add("show");


        status.innerHTML =
            "Tekan LANJUTKAN untuk melanjutkan.";


        /* Hapus listener */

        player.removeEventListener(
            "timeupdate",
            checkVideoTime
        );

    }

}


/* ==========================================
   TOMBOL LANJUTKAN
   ========================================== */

document
.getElementById("continueButton")
.addEventListener(
    "click",
    function() {

        /*
         * Direct Link hanya dibuka
         * setelah user menekan tombol.
         */

        if (!redirectLink) {
            return;
        }


        window.location.href =
            redirectLink;

    }
);

</script>
